<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termékek és Vásárlás</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .product {
            text-align: center;
        }
        .product img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .price {
            font-size: 24px;
            color: #28a745;
            margin: 20px 0;
        }
        .buy-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }
        .buy-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Online Áruház</h1>
    <div class="product">
        <img src="csali.JPEG" width="50%" height="auto" alt="Termék">
        <h2>Szuper Termék</h2>
        <p>A legjobb termék, amit valaha vásárolhatsz! Kiváló minőség, fantasztikus ár!</p>
        <p class="price">10,000 Ft</p>
        <button class="buy-btn" id="checkout-button">Vásárlás</button>
    </div>
</div>

<script>
    // A Stripe nyilvános API kulcsod
    var stripe = Stripe('pk_test_4TbuOHmfzxyAPFGJ7z6ti1XN'); // Cseréld le a saját kulcsodra!

    // A vásárlás gombot meghatározó esemény
    var checkoutButton = document.getElementById('checkout-button');

    checkoutButton.addEventListener('click', function () {
        // Kérés a backend szerverhez a fizetéshez szükséges "session" létrehozásához
        fetch('/create-checkout-session', {
            method: 'POST',
        })
        .then(function (response) {
            return response.json();
        })
        .then(function (sessionId) {
            // Irányítás a Stripe Checkout oldalra
            return stripe.redirectToCheckout({ sessionId: sessionId });
        })
        .then(function (result) {
            if (result.error) {
                alert(result.error.message);
            }
        })
        .catch(function (error) {
            console.error("Hiba történt:", error);
        });
    });
</script>

</body>
</html>
